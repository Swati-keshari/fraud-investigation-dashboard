# Two Render web services:
#   https://watch-desk-web.onrender.com   → Next.js Watch Desk UI
#   https://watch-desk-lgbm.onrender.com  → LightGBM scoring API
services:
  - type: web
    name: watch-desk-lgbm
    runtime: python
    rootDir: ml-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serve:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    healthCheckPath: /health
  - type: web
    name: watch-desk-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: NODE_OPTIONS=--max-old-space-size=460 npm ci --omit=optional && NODE_OPTIONS=--max-old-space-size=460 npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_ML_SCORE_URL
        value: https://watch-desk-lgbm.onrender.com/score
      - key: NEXT_PUBLIC_ML_HEALTH_URL
        value: https://watch-desk-lgbm.onrender.com/health

